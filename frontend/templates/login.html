<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAU Cyber Security and Innovations Club - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen text-slate-800 dark:text-slate-100 font-sans transition-colors duration-300 flex flex-col justify-between">

    <div class="absolute top-6 right-6 z-50">
        <button id="themeToggleBtn" class="p-2.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-amber-400 transition-colors shadow-md" title="Toggle Theme Mode">
            <svg id="sunIcon" class="h-5 w-5 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364-6.364l-.707.707M6.343 17.657l-.707.707M16.243 17.657l.707.707M6.343 6.343l.707-.707M12 8a4 4 0 100 8 4 4 0 000-8z"></path>
            </svg>
            <svg id="moonIcon" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
        </button>
    </div>

    <div class="flex-grow flex items-center justify-center p-4 sm:p-6">
        <div class="w-full max-w-md bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-2xl p-6 transition-colors duration-300 relative overflow-hidden">
            
            <div class="absolute top-0 inset-x-0 h-1.5 bg-[#14213d]"></div>

            <div class="text-center mb-4">
                <div class="inline-flex items-center justify-center mb-2">
                    <img src="/assets/club_logo.png" alt="SLAU Cyber Security Seal" class="h-36 w-36 object-contain invert brightness-200 transition-all duration-300">
                </div>
                
                <h1 class="text-xl font-black uppercase tracking-wide text-slate-900 dark:text-white leading-snug">
                    Cyber Security & Innovations Club
                </h1>
                
                <p class="text-xs text-slate-600 dark:text-slate-300 uppercase tracking-wider font-bold mt-1">
                    Office of the Head of Projects
                </p>
            </div>

            <div class="mb-4">
                {% if login_error %}
                <div class="mb-3 rounded-xl border border-amber-300 bg-amber-50 px-4 py-3 text-left text-xs font-semibold text-amber-900">
                    {{ login_error }}
                </div>
                {% endif %}
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-[10px] text-slate-500 dark:text-slate-300 font-mono uppercase tracking-widest">Use Credentials</span>
                    <div class="flex-grow border-t border-slate-200 dark:border-slate-700"></div>
                </div>
            </div>

            <form id="loginForm" action="/login" method="POST" class="space-y-3">
                
                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold mb-1 uppercase tracking-wider" for="email">
                        Official Identity (Email Address)
                    </label>
                    <div class="relative">
                        <input class="w-full pl-4 pr-10 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-colors font-mono tracking-wide" 
                               type="email" id="email" name="email" placeholder="kevin_ssali@stlawrence.ac.ug" required>
                        <div class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none text-slate-400">
                            <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.206"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-slate-700 dark:text-slate-300 text-xs font-bold mb-1 uppercase tracking-wider" for="password">
                        Security Secret Token (Password)
                    </label>
                    <div class="relative">
                        <input class="w-full pl-4 pr-12 py-2.5 bg-slate-50 dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-xl text-slate-900 dark:text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20 transition-colors font-mono tracking-wide" 
                               type="password" id="password" name="password" placeholder="••••••••••••" required>
                        
                        <button type="button" id="passwordToggleBtn" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors" title="Toggle Password Visibility">
                            <svg id="eyeIcon" class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                            <svg id="eyeOffIcon" class="h-4 w-4 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.542-7a9.97 9.97 0 011.563-3.029m5.858.5a5.001 5.001 0 019.288 0M15 12a3 3 0 11-6 0 3 3 0 016 0zm6.364-6.364l-14 14"></path>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full mt-1 py-3 bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800/60 text-white font-bold rounded-xl shadow-lg hover:shadow-blue-500/20 transition-all duration-200 uppercase tracking-wider text-xs flex items-center justify-center gap-2">
                    <svg id="btnSpinner" class="animate-spin h-4 w-4 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span id="btnText">Authenticate Core Session</span>
                </button>

            </form>
        </div>
    </div>

    <footer class="py-4 text-center text-[10px] tracking-widest text-slate-400 dark:text-slate-600 font-mono uppercase transition-colors">
        St. Lawrence University &copy; 2026 // Security Terminal Secure
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            const systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            
            if (savedTheme === 'dark' || (!savedTheme && systemPrefersDark)) {
                document.documentElement.classList.add('dark');
                document.getElementById('sunIcon').classList.remove('hidden');
                document.getElementById('moonIcon').classList.add('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('sunIcon').classList.add('hidden');
                document.getElementById('moonIcon').classList.remove('hidden');
            }
        });

        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        themeToggleBtn.addEventListener('click', () => {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            }
        });

        const passwordToggleBtn = document.getElementById('passwordToggleBtn');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        const eyeOffIcon = document.getElementById('eyeOffIcon');

        passwordToggleBtn.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.add('hidden');
                eyeOffIcon.classList.remove('hidden');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('hidden');
                eyeOffIcon.classList.add('hidden');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitBtn');
            const spinner = document.getElementById('btnSpinner');
            const text = document.getElementById('btnText');

            btn.disabled = true;
            spinner.classList.remove('hidden');
            text.innerText = "Verifying Credentials...";
        });
    </script>
</body>
</html>
